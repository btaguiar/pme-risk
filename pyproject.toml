[project]
name = "pme-risk"
version = "0.1.0"
description = "Laudo de risco de crédito PME, auditável, em GCP"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "google-genai>=1.0",
    "google-cloud-bigquery>=3.25",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["model", "agents", "api", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
